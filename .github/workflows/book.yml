name: Build and publish book

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# Superseded builds on the same branch need not finish.
concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all default-font editions (LaTeX development)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set TeX Live installation directory
        run: echo "NT_TEXLIVE_ROOT=$RUNNER_TEMP/number-theory-texlive" >> "$GITHUB_ENV"

      - name: Discover the current TeX Live release and mirror
        id: texlive
        run: bash scripts/texlive-ci.sh prepare

      - name: Restore TeX Live and font caches
        id: tex-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NT_TEXLIVE_ROOT }}
          key: texlive-ubuntu24-x64-${{ steps.texlive.outputs.year }}-${{ hashFiles('scripts/texlive-ci.sh') }}-${{ steps.texlive.outputs.day }}
          restore-keys: |
            texlive-ubuntu24-x64-${{ steps.texlive.outputs.year }}-${{ hashFiles('scripts/texlive-ci.sh') }}-

      - name: Install if needed, then update all packages on every run
        env:
          NT_TEXLIVE_INSTALLER: ${{ steps.texlive.outputs.installer }}
          NT_TEXLIVE_REPOSITORY: ${{ steps.texlive.outputs.repository }}
          NT_TEXLIVE_YEAR: ${{ steps.texlive.outputs.year }}
        run: bash scripts/texlive-ci.sh install

      # Save after successful setup, even if the book later hits an upstream bug.
      # A dated key gives immutable GitHub caches a new snapshot each UTC day.
      - name: Save refreshed TeX Live cache
        if: steps.tex-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NT_TEXLIVE_ROOT }}
          key: ${{ steps.tex-cache.outputs.cache-primary-key }}

      - name: Compile canonical editions with the default fonts
        run: |
          make all ENGINE=lualatex-dev LATEXMK='latexmk -r scripts/latexmk-ci.rc'
          python3 scripts/book-publication.py collect --profile canonical

      - name: Save canonical PDFs
        uses: actions/upload-artifact@v4
        with:
          name: book-pdfs-canonical
          path: dist/*.pdf
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Compile Ally editions with the same updated installation
        run: |
          make ally all ENGINE=lualatex-dev LATEXMK='latexmk -r scripts/latexmk-ci.rc'
          python3 scripts/book-publication.py collect --profile ally

      - name: Save Ally PDFs
        uses: actions/upload-artifact@v4
        with:
          name: book-pdfs-ally
          path: dist/*.pdf
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Save diagnostics, including failed builds
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: book-diagnostics
          path: |
            diagnostics/
            build/*.log
            build/*.blg
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Generate the official book page
    needs: build
    # Generate a reviewable artifact on every branch, even without publishing.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: book-pdfs-*
          merge-multiple: true
          path: _pdfs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install publication tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 -m pip install -r scripts/publication-requirements.txt
      - name: Generate covers, contents, download table and Jekyll page
        run: python3 scripts/book-publication.py site
      - uses: actions/upload-artifact@v4
        with:
          name: book-website-publication
          path: _publication/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-website:
    name: Deploy the book directory to the official website
    needs: package
    if: >-
      vars.PUBLISH_PDFS == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    concurrency:
      group: book-official-website
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Check publication configuration
        env:
          WEBSITE_DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          WEBSITE_SOURCE_BRANCH: ${{ vars.WEBSITE_SOURCE_BRANCH }}
          WEBSITE_DEPLOY_BRANCH: ${{ vars.WEBSITE_DEPLOY_BRANCH }}
        run: |
          test -n "$WEBSITE_DEPLOY_KEY" || { echo 'Set WEBSITE_DEPLOY_KEY.' >&2; exit 1; }
          test -n "$WEBSITE_SOURCE_BRANCH" || { echo 'Set WEBSITE_SOURCE_BRANCH.' >&2; exit 1; }
          test -n "$WEBSITE_DEPLOY_BRANCH" || { echo 'Set WEBSITE_DEPLOY_BRANCH.' >&2; exit 1; }
          test "$WEBSITE_SOURCE_BRANCH" != "$WEBSITE_DEPLOY_BRANCH"
      - uses: actions/download-artifact@v4
        with:
          name: book-website-publication
          path: _publication
      - name: Read the current website theme
        uses: actions/checkout@v6
        with:
          repository: EgbertRijke/egbertrijke.github.io
          ref: ${{ vars.WEBSITE_SOURCE_BRANCH }}
          path: _website-source
          ssh-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Prepare the book's isolated Jekyll build
        run: python3 scripts/prepare-book-site.py --website _website-source
      - name: Render the book page with the website theme
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_book-source
          destination: ./_book-site
      - name: Check out a disposable website working tree for deployment
        uses: actions/checkout@v6
        with:
          repository: EgbertRijke/egbertrijke.github.io
          ref: ${{ vars.WEBSITE_SOURCE_BRANCH }}
          path: _deploy
          ssh-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          persist-credentials: true
      - name: Refuse publication from an obsolete book commit
        env:
          BOOK_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$BOOK_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo 'A newer book commit exists. Publish from the latest commit.' >&2
            exit 1
          }
      - name: Publish only notes/number-theory in the deployment branch
        env:
          WEBSITE_DEPLOY_BRANCH: ${{ vars.WEBSITE_DEPLOY_BRANCH }}
        run: >-
          python3 scripts/publish-site.py --scope book
          --build _book-site --checkout _deploy --branch "$WEBSITE_DEPLOY_BRANCH"

  legacy-package:
    name: Keep former book URLs working
    needs: publish-website
    if: vars.KEEP_LEGACY_BOOK_URLS == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: book-pdfs-*
          merge-multiple: true
          path: _pdfs
      - run: python3 scripts/book-publication.py legacy
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish the legacy redirect and PDF aliases
    needs: legacy-package
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: book-pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
