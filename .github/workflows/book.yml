name: Build and publish book

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      rebuild_latex:
        description: 'Recompile all PDFs with updated TeX Live, even if cached'
        type: boolean
        default: false

env:
  LATEX_CACHE_VERSION: '1'

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all editions (LaTeX development)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compute book input fingerprint
        id: book-inputs
        run: |
          input_hash=$(python3 scripts/latex-cache-key.py)
          echo "hash=$input_hash" >> "$GITHUB_OUTPUT"

      - name: Restore completed LaTeX build
        id: latex-cache
        if: ${{ !inputs.rebuild_latex }}
        uses: actions/cache/restore@v4
        with:
          path: |
            build/
            number-theory*.pdf
            diagnostics/
          key: latex-build-${{ env.LATEX_CACHE_VERSION }}-ubuntu24-${{ runner.arch }}-${{ steps.book-inputs.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            latex-build-${{ env.LATEX_CACHE_VERSION }}-ubuntu24-${{ runner.arch }}-${{ steps.book-inputs.outputs.hash }}-

      - name: Validate all restored canonical and Ally PDFs
        id: cached-pdfs
        if: steps.latex-cache.outputs.cache-matched-key != ''
        continue-on-error: true
        run: |
          python3 scripts/book-publication.py collect --profile canonical
          python3 scripts/book-publication.py collect --profile ally

      - name: Start a clean build when PDFs cannot be reused
        if: steps.cached-pdfs.outcome != 'success'
        run: |
          rm -rf build diagnostics dist
          rm -f number-theory*.pdf

      # An exact input-hash hit above skips TeX entirely. On an input change,
      # reuse the previous *successful* auxiliary files as a starting point.
      # The Makefile and latexmk must still recheck new inputs and converge.
      # Do not reuse invalid exact caches or explicitly forced builds.
      - name: Restore prior build state for incremental LaTeX compilation
        id: prior-state
        if: >-
          steps.cached-pdfs.outcome != 'success' &&
          steps.latex-cache.outputs.cache-matched-key == '' &&
          !inputs.rebuild_latex
        uses: actions/cache/restore@v4
        with:
          path: |
            build/
            number-theory*.pdf
            diagnostics/
          key: latex-build-${{ env.LATEX_CACHE_VERSION }}-ubuntu24-${{ runner.arch }}-incremental-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            latex-build-${{ env.LATEX_CACHE_VERSION }}-ubuntu24-${{ runner.arch }}-

      - name: Preserve previous build's TeX Live identity
        if: steps.prior-state.outputs.cache-matched-key != ''
        run: |
          mkdir -p "$RUNNER_TEMP/nt-previous-toolchain"
          for file in texlive-packages.txt toolchain.txt runner-image.txt; do
            if [ -f "diagnostics/$file" ]; then
              cp "diagnostics/$file" "$RUNNER_TEMP/nt-previous-toolchain/$file"
            fi
          done

      - name: Report PDF reuse
        if: steps.cached-pdfs.outcome == 'success'
        run: |
          echo 'Reusing cached canonical and Ally PDFs; no TeX compilation.'
          echo 'PDFs and their build dates are reused. Website generation still runs.' >> "$GITHUB_STEP_SUMMARY"

      - name: Set TeX Live installation directory
        if: steps.cached-pdfs.outcome != 'success'
        run: |
          echo "NT_TEXLIVE_ROOT=$RUNNER_TEMP/number-theory-texlive" >> "$GITHUB_ENV"
          echo "NT_TEXLIVE_CACHE_DAY=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Restore TeX Live caches
        if: steps.cached-pdfs.outcome != 'success'
        id: tex-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NT_TEXLIVE_ROOT }}
          key: texlive-ubuntu24-x64-rolling-${{ env.NT_TEXLIVE_CACHE_DAY }}
          restore-keys: |
            texlive-ubuntu24-x64-rolling-
            texlive-ubuntu24-x64-

      - name: Verify restored TeX Live cache
        if: steps.cached-pdfs.outcome != 'success'
        id: tex-cache-check
        env:
          NT_TEXLIVE_CACHE_MATCHED_KEY: ${{ steps.tex-cache.outputs.cache-matched-key }}
        run: bash scripts/texlive-ci.sh inspect-cache

      - name: Discover the TeX Live installation or mirror
        if: steps.cached-pdfs.outcome != 'success'
        id: texlive
        run: bash scripts/texlive-ci.sh prepare

      - name: Install or update TeX Live, falling back to cache on network errors
        if: steps.cached-pdfs.outcome != 'success'
        id: texlive-install
        env:
          NT_TEXLIVE_INSTALLER: ${{ steps.texlive.outputs.installer }}
          NT_TEXLIVE_REPOSITORY: ${{ steps.texlive.outputs.repository }}
          NT_TEXLIVE_YEAR: ${{ steps.texlive.outputs.year }}
          NT_TEXLIVE_OFFLINE: ${{ steps.texlive.outputs.offline }}
          NT_TEXLIVE_EXACT_CACHE_HIT: ${{ steps.tex-cache.outputs.cache-hit }}
        run: bash scripts/texlive-ci.sh install

      # The rolling development format, biblatex, Biber and system fonts may
      # change independently of the manuscript. Reuse auxiliaries only when
      # the current installation and runner image match the previous build.
      - name: Reject incremental state from a different TeX Live or runner
        if: steps.cached-pdfs.outcome != 'success'
        env:
          PRIOR_CACHE_KEY: ${{ steps.prior-state.outputs.cache-matched-key }}
        run: |
          printf '%s:%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" \
            > diagnostics/runner-image.txt
          if [ -n "$PRIOR_CACHE_KEY" ]; then
            prev="$RUNNER_TEMP/nt-previous-toolchain"
            identical=true
            cmp -s "$prev/texlive-packages.txt" diagnostics/texlive-packages.txt || identical=false
            cmp -s "$prev/runner-image.txt" diagnostics/runner-image.txt || identical=false
            # Toolchain line 2 contains only the UTC date/time of the build.
            if [ -f "$prev/toolchain.txt" ]; then
              sed '2d' "$prev/toolchain.txt" > "$RUNNER_TEMP/previous-tools.txt"
              sed '2d' diagnostics/toolchain.txt > "$RUNNER_TEMP/current-tools.txt"
              cmp -s "$RUNNER_TEMP/previous-tools.txt" "$RUNNER_TEMP/current-tools.txt" || identical=false
            else
              identical=false
            fi
            if [ "$identical" != true ]; then
              echo 'TeX Live or runner changed: discarding old auxiliary state.'
              rm -rf build
              rm -f number-theory*.pdf
            else
              echo 'TeX Live and runner match: reusing auxiliaries, recompiling changed inputs.'
            fi
          fi

      - name: Save refreshed TeX Live cache
        if: steps.cached-pdfs.outcome != 'success' && steps.tex-cache.outputs.cache-hit != 'true' && steps.texlive-install.outputs.cacheable == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NT_TEXLIVE_ROOT }}
          key: ${{ steps.tex-cache.outputs.cache-primary-key }}

      - name: Compile canonical editions
        if: steps.cached-pdfs.outcome != 'success'
        run: make all ENGINE=lualatex-dev LATEXMK='latexmk -r scripts/latexmk-ci.rc'

      - name: Collect canonical PDFs (fresh or cached)
        run: python3 scripts/book-publication.py collect --profile canonical

      - name: Save canonical PDFs
        uses: actions/upload-artifact@v4
        with:
          name: book-pdfs-canonical
          path: dist/*.pdf
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Compile Ally editions with the same updated installation
        if: steps.cached-pdfs.outcome != 'success'
        run: make ally all ENGINE=lualatex-dev LATEXMK='latexmk -r scripts/latexmk-ci.rc'

      - name: Collect Ally PDFs (fresh or cached)
        run: python3 scripts/book-publication.py collect --profile ally

      - name: Save Ally PDFs
        uses: actions/upload-artifact@v4
        with:
          name: book-pdfs-ally
          path: dist/*.pdf
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Cache completed PDFs and LaTeX-generated files
        if: steps.cached-pdfs.outcome != 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            build/
            number-theory*.pdf
            diagnostics/
          key: latex-build-${{ env.LATEX_CACHE_VERSION }}-ubuntu24-${{ runner.arch }}-${{ steps.book-inputs.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save diagnostics, including failed builds
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: book-diagnostics
          path: |
            diagnostics/
            build/*.log
            build/*.blg
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Generate the official book page
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: book-pdfs-*
          merge-multiple: true
          path: _pdfs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install publication tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 -m pip install -r scripts/publication-requirements.txt
      - name: Generate covers, contents, download table and Jekyll page
        run: python3 scripts/book-publication.py site
      - uses: actions/upload-artifact@v4
        with:
          name: book-website-publication
          path: _publication/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-website:
    name: Deploy the book directory to the official website
    needs: package
    if: >-
      vars.PUBLISH_PDFS == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    concurrency:
      group: book-official-website
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Check publication configuration
        env:
          WEBSITE_DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          WEBSITE_SOURCE_BRANCH: ${{ vars.WEBSITE_SOURCE_BRANCH }}
          WEBSITE_DEPLOY_BRANCH: ${{ vars.WEBSITE_DEPLOY_BRANCH }}
        run: |
          test -n "$WEBSITE_DEPLOY_KEY" || { echo 'Set WEBSITE_DEPLOY_KEY.' >&2; exit 1; }
          test -n "$WEBSITE_SOURCE_BRANCH" || { echo 'Set WEBSITE_SOURCE_BRANCH.' >&2; exit 1; }
          test -n "$WEBSITE_DEPLOY_BRANCH" || { echo 'Set WEBSITE_DEPLOY_BRANCH.' >&2; exit 1; }
          test "$WEBSITE_SOURCE_BRANCH" != "$WEBSITE_DEPLOY_BRANCH"
      - uses: actions/download-artifact@v4
        with:
          name: book-website-publication
          path: _publication
      - name: Read the current website theme
        uses: actions/checkout@v6
        with:
          repository: EgbertRijke/egbertrijke.github.io
          ref: ${{ vars.WEBSITE_SOURCE_BRANCH }}
          path: _website-source
          ssh-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Prepare the book's isolated Jekyll build
        run: python3 scripts/prepare-book-site.py --website _website-source
      - name: Render the book page with the website theme
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_book-source
          destination: ./_book-site
      - name: Check out a disposable website working tree for deployment
        uses: actions/checkout@v6
        with:
          repository: EgbertRijke/egbertrijke.github.io
          ref: ${{ vars.WEBSITE_SOURCE_BRANCH }}
          path: _deploy
          ssh-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          persist-credentials: true
      - name: Refuse publication from an obsolete book commit
        env:
          BOOK_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$BOOK_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo 'A newer book commit exists. Publish from the latest commit.' >&2
            exit 1
          }
      - name: Publish only notes/number-theory in the deployment branch
        env:
          WEBSITE_DEPLOY_BRANCH: ${{ vars.WEBSITE_DEPLOY_BRANCH }}
        run: >-
          python3 scripts/publish-site.py --scope book
          --build _book-site --checkout _deploy --branch "$WEBSITE_DEPLOY_BRANCH"

  legacy-package:
    name: Keep former book URLs working
    needs: publish-website
    if: vars.KEEP_LEGACY_BOOK_URLS == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: book-pdfs-*
          merge-multiple: true
          path: _pdfs
      - run: python3 scripts/book-publication.py legacy
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish the legacy redirect and PDF aliases
    needs: legacy-package
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: book-pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
